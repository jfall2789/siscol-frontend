<div class="container-fluid login-page p-0">

  <div class="row h-100 m-0">

    <!-- Lado izquierdo -->
    <div class="col-lg-7 d-none d-lg-flex login-left">

      <div class="login-brand">

        <div class="brand-logo">

          <img
            src="/images/logoSiscol.png"
            alt="SisCol"
            class="siscol-logo">

          <p class="brand-subtitle">
            Gestión inteligente para instituciones educativas
          </p>

        </div>

        <div class="brand-features">

          <div class="feature-item">
            <i class="bi bi-check-circle-fill me-2"></i>
            Gestión de usuarios
          </div>

          <div class="feature-item">
            <i class="bi bi-check-circle-fill me-2"></i>
            Gestión de incidencias
          </div>

          <div class="feature-item">
            <i class="bi bi-check-circle-fill me-2"></i>
            Gestión de requerimientos
          </div>

        </div>

      </div>

    </div>

    <!-- Lado derecho -->
    <div class="col-lg-5 d-flex justify-content-center align-items-center">

      <div class="login-card">

        <div class="text-center">

          <img
            src="/images/logoColeDiego.jpeg"
            alt="Institución Educativa Diego Thomson"
            class="login-logo">

        </div>

        <div class="text-center mb-3">

          <div class="school-name">
            Institución Educativa
          </div>

          <div class="school-title">
            Diego Thomson
          </div>

          <div class="school-code">
            Código Modular 40222
          </div>

        </div>

        <hr>

        <div class="text-center mb-3">

          <h2>
            Bienvenido
          </h2>

          <p class="login-subtitle">
            Ingrese sus credenciales institucionales
          </p>

        </div>

        <form>

          <div class="mb-3">

            <label class="form-label">
              Correo institucional
            </label>

            <input
              type="email"
              class="form-control"
              placeholder="nombre.apellido@siscol.edu.pe">

          </div>

          <div class="mb-3">

            <label class="form-label">
              Contraseña
            </label>

            <input
              type="password"
              class="form-control"
              placeholder="********">

          </div>

          <div class="form-check mb-4">

            <input
              class="form-check-input"
              type="checkbox"
              id="remember">

            <label
              class="form-check-label"
              for="remember">

              Recordarme

            </label>

          </div>

          <button
            type="submit"
            class="btn btn-primary w-100">

            <i class="bi bi-box-arrow-in-right me-2"></i>

            Iniciar sesión

          </button>

        </form>

        <hr>

        <p class="footer-login text-center mb-0">

          © 2026 SisCol · Maestría en TI · UNSA

        </p>

      </div>

    </div>

  </div>

</div>
