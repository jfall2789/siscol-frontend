<div class="container-fluid">

    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold mb-1">
                Gestión de Incidencias
            </h2>

            <p class="text-muted mb-0">
                Administre las incidencias registradas en el sistema.
            </p>

        </div>

        <a
            routerLink="/dashboard/incidents/new"
            class="btn btn-primary">

            <i class="bi bi-plus-circle me-2"></i>

            Nueva Incidencia

        </a>

    </div>

    <!-- Filtros -->
    <div class="card border-0 shadow-sm mb-4">

        <div class="card-body">

            <div class="row g-3">

                <div class="col-md-4">

                    <input
                        class="form-control"
                        placeholder="Buscar por código o asunto">

                </div>

                <div class="col-md-3">

                    <select class="form-select">

                        <option>Todos los estados</option>

                    </select>

                </div>

                <div class="col-md-3">

                    <select class="form-select">

                        <option>Todas las prioridades</option>

                    </select>

                </div>

                <div class="col-md-2">

                    <button class="btn btn-outline-primary w-100">

                        <i class="bi bi-search me-2"></i>

                        Buscar

                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- Tabla -->
    <div class="card border-0 shadow-sm">

        <div class="table-responsive">

            <table class="table table-hover align-middle mb-0">

                <thead class="table-light">

                    <tr>

                        <th>Código</th>

                        <th>Título</th>

                        <th>Reportado por</th>

                        <th>Estado</th>

                        <th>Prioridad</th>

                        <th class="text-center">
                            Acciones
                        </th>

                    </tr>

                </thead>

                <tbody>

                    <tr *ngFor="let incident of incidents">

                        <td>
                            <strong>{{ incident.code }}</strong>
                        </td>

                        <td>
                            {{ incident.title }}
                        </td>

                        <td>
                            Sistema
                        </td>

                        <td>

                            <span
                                class="badge rounded-pill bg-warning text-dark">

                                {{ incident.status }}

                            </span>

                        </td>

                        <td>

                            <span
                                class="badge rounded-pill bg-danger">

                                {{ incident.priority }}

                            </span>

                        </td>

                        <td class="text-center">

                            <button
                                class="btn btn-sm btn-outline-primary me-2">

                                <i class="bi bi-eye"></i>

                            </button>

                            <button
                                class="btn btn-sm btn-outline-success me-2">

                                <i class="bi bi-pencil"></i>

                            </button>

                            <button
                                class="btn btn-sm btn-outline-danger">

                                <i class="bi bi-trash"></i>

                            </button>

                        </td>

                    </tr>

                    <tr *ngIf="incidents.length === 0">

                        <td
                            colspan="6"
                            class="text-center py-5 text-muted">

                            No existen incidencias registradas.

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>
